name: CI - Lint, Test & Validate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  python-tests:
    name: Python Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Compile and syntax check Python files
        run: |
          python -m py_compile backend/*.py backend/data/*.py setup.py

      - name: Run Test Suite
        run: |
          pytest tests/ -v

  node-lint:
    name: Node.js Syntax & Proxy Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Proxy Server Syntax
        run: |
          node --check proxy-server/server.js

      - name: Check Frontend Scripts Syntax
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/api.js
          node --check frontend/js/store.js
          node --check frontend/js/nav.js
          node -e "const fs = require('fs'); fs.readdirSync('frontend/js/components').forEach(f => { if (f.endsWith('.js')) { require('child_process').execSync('node --check frontend/js/components/' + f); } });"

  docker-compose-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Dummy .env for Validation
        run: |
          cp .env.example .env

      - name: Validate Docker Compose Config
        run: |
          docker compose config
          docker compose -f docker-compose.yml -f docker-compose.proxy.yml config
