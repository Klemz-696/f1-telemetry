user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    # ── Compression ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/html
        image/svg+xml;

    # ── Real IP from upstream reverse-proxy / Docker network ───────────────────
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  127.0.0.1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ── Rate limiting ──────────────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api_limit:10m    rate=60r/s;
    limit_req_zone  $binary_remote_addr zone=proxy_limit:10m  rate=60r/s;
    limit_req_zone  $binary_remote_addr zone=static_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Buffers / timeouts ─────────────────────────────────────────────────────
    client_body_buffer_size     10k;
    client_header_buffer_size   1k;
    client_max_body_size        1m;
    large_client_header_buffers 2 1k;
    client_body_timeout   12;
    client_header_timeout 12;
    send_timeout          10;

    server {
        listen 80;
        server_name _;

        # ── En-têtes de sécurité ───────────────────────────────────────────────
        add_header X-Frame-Options             "SAMEORIGIN"                       always;
        add_header X-Content-Type-Options      "nosniff"                          always;
        add_header X-XSS-Protection            "1; mode=block"                    always;
        add_header Referrer-Policy             "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy          "geolocation=(), microphone=(), camera=()" always;

        # Content-Security-Policy
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' ws: wss: http://localhost:8000 http://localhost:3001 ws://localhost:3001 ws://localhost:8000 https://api.jolpi.ca https://api.openf1.org https://livetiming.formula1.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
            always;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Host              $host;
        proxy_hide_header X-Powered-By;

        # ── Proxy WebSocket state push ─────────────────────────────────────────
        location /proxy/ws {
            proxy_pass         http://proxy:3001/ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
            limit_conn conn_limit 50;
        }

        # ── Proxy HTTP cache Node.js ───────────────────────────────────────────
        location /proxy/ {
            limit_req  zone=proxy_limit burst=100 nodelay;
            limit_conn conn_limit 60;
            rewrite ^/proxy/(.*) /$1 break;
            proxy_pass http://proxy:3001;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Connection        "";
            proxy_read_timeout    90s;
            proxy_connect_timeout 90s;
            proxy_send_timeout    90s;
            add_header Access-Control-Allow-Origin  "https://$host" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS"  always;
            add_header Access-Control-Allow-Headers "Content-Type"  always;
        }

        # ── WebSocket télémétrie live (FastAPI) ────────────────────────────────
        location /ws {
            proxy_pass http://api:8000/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 10s;
            limit_conn conn_limit 50;
        }

        # ── API FastAPI ────────────────────────────────────────────────────────
        location /api/ {
            limit_req  zone=api_limit burst=100 nodelay;
            limit_conn conn_limit 60;
            proxy_pass http://api:8000/;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
            limit_except GET OPTIONS { deny all; }
        }

        # ── Fichiers statiques frontend ────────────────────────────────────────
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            limit_req  zone=static_limit burst=120 nodelay;
            limit_conn conn_limit 100;
            limit_except GET { deny all; }

            location ~* \.(woff2|woff|ttf|ico|png|svg)$ {
                add_header Cache-Control "public, max-age=31536000, immutable";
            }
            location ~* \.(js|css)$ {
                add_header Cache-Control "no-cache, must-revalidate";
            }
        }

        # ── Pages d'erreur ─────────────────────────────────────────────────────
        error_page 404 /404.html;
        error_page 500 502 503 504 /502.html;
        location = /404.html { root /usr/share/nginx/html; internal; }
        location = /502.html { root /usr/share/nginx/html; internal; }

        # ── Bloquer les fichiers sensibles ─────────────────────────────────────
        location ~ /\.(env|git|htaccess|DS_Store) { deny all; return 404; }
        location ~ \.(py|sh|yml|yaml|toml|lock)$  { deny all; return 404; }
    }

    # ── Bloc HTTPS — décommenter après installation Certbot ───────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name votre-domaine.com;
    #     ssl_certificate     /etc/letsencrypt/live/votre-domaine.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/votre-domaine.com/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #     # ... mêmes blocs location que ci-dessus ...
    # }
    # server {
    #     listen 80;
    #     server_name votre-domaine.com;
    #     return 301 https://$host$request_uri;
    # }
}
